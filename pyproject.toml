[project]
name = "orbi"
version = "1.0.0"
description = "Orbi — Assistant Universel Telegram @OrbiBot"
requires-python = ">=3.12"
dependencies = [
    # Telegram Bot
    "python-telegram-bot[ext]>=21.0,<23.0",

    # Web Framework
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9",

    # Database
    "pymongo>=4.13.0,<5.0.0",
    "beanie>=2.2.0,<3.0.0",

    # Cache
    "redis[hiredis]>=5.0.0,<9.0.0",

    # Configuration
    "pydantic-settings>=2.5.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",

    # HTTP Client
    "httpx>=0.27.0,<1.0.0",

    # Chiffrement des secrets d'intégration (Fernet)
    "cryptography>=50.0.0,<51.0.0",

    # Scheduler
    "apscheduler>=3.10.0,<4.0.0",

    # Monitoring
    "prometheus-client>=0.20.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx",
    "fakeredis>=2.26.0",
    "ruff>=0.6.0",
]

# Beanie 2.2.0 déclare « Requires-Python <3.14 » alors qu'il fonctionne en 3.14 (voir docs/adr/0006-python-3.14.md).
# On ne corrige que cette métadonnée (dépendances inchangées, extras non utilisés omis) ;
# à retirer dès que Beanie publie une version qui supporte officiellement 3.14.
[[tool.uv.dependency-metadata]]
name = "beanie"
version = "2.2.0"
requires-python = ">=3.10"
requires-dist = [
    "pydantic>=2.4,<3.0",
    "click>=7",
    "lazy-model>=0.4.0,<1.0.0",
    "pymongo>=4.11.0,<5.0.0,!=4.15.0",
    "typing-extensions>=4.7",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E501 : lignes longues = textes i18n inline ; W291 : doubles espaces = retours à la ligne Markdown
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/handlers/developer_real.py" = ["W291"]
"src/handlers/group_management.py" = ["W291"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Une seule boucle d'événements pour toute la session : le client PyMongo async y est lié.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
