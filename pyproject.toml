[project]
name = "orbi"
version = "1.0.0"
description = "Orbi — Assistant Universel Telegram @OrbiBot"
requires-python = ">=3.12"
dependencies = [
    # Telegram Bot
    "python-telegram-bot[ext]>=21.0,<22.0",

    # Web Framework
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9",

    # Database
    "motor>=3.6.0,<4.0.0",
    "beanie>=1.26.0,<2.0.0",

    # Cache
    "redis[hiredis]>=5.0.0,<6.0.0",

    # Configuration
    "pydantic-settings>=2.5.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",

    # HTTP Client
    "httpx>=0.27.0,<1.0.0",

    # Chiffrement des secrets d'intégration (Fernet)
    "cryptography>=43.0.0,<50.0.0",

    # Scheduler
    "apscheduler>=3.10.0,<4.0.0",

    # Monitoring
    "prometheus-client>=0.20.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx",
    "mongomock-motor>=0.0.34",
    "fakeredis>=2.26.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E501 : lignes longues = textes i18n inline ; W291 : doubles espaces = retours à la ligne Markdown
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/handlers/developer_real.py" = ["W291"]
"src/handlers/group_management.py" = ["W291"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
