<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>{% block title %}Orbi Dev{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #121212; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
        .narrow { max-width: 720px; }
        .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: #1e1e1e; border-top: 1px solid #333;
                  padding-bottom: env(safe-area-inset-bottom); z-index: 1030; }
        .tabbar a { color: #adb5bd; text-decoration: none; font-size: .75rem; padding: .5rem 0; min-height: 56px; }
        .tabbar a.active { color: #0d6efd; }
        .tabbar i { display: block; font-size: 1.35rem; }
        .btn, .form-control, .form-select { min-height: 44px; }
        .prompt { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>
    <header class="border-bottom border-secondary">
        <div class="narrow mx-auto px-3 py-2 d-flex justify-content-between align-items-center">
            <a href="/dev/" class="fw-bold text-decoration-none text-light"><i class="bi bi-robot"></i> Orbi Dev</a>
            <a href="/admin/" class="small text-secondary text-decoration-none">Admin</a>
        </div>
    </header>

    <main class="narrow mx-auto px-3 py-3">
        {% block content %}{% endblock %}
    </main>

    <nav class="tabbar" aria-label="Navigation">
        <div class="narrow mx-auto d-flex text-center">
            <a href="/dev/" class="flex-fill {% if active_nav == 'tasks' %}active{% endif %}"><i class="bi bi-list-task"></i>Tâches</a>
            <a href="/dev/tasks/new" class="flex-fill {% if active_nav == 'new' %}active{% endif %}"><i class="bi bi-plus-circle"></i>Nouvelle</a>
            <a href="/dev/projects" class="flex-fill {% if active_nav == 'projects' %}active{% endif %}"><i class="bi bi-folder2"></i>Projets</a>
            <a href="/dev/integrations" class="flex-fill {% if active_nav == 'keys' %}active{% endif %}"><i class="bi bi-key"></i>Clés</a>
        </div>
    </nav>
    {% block scripts %}{% endblock %}
</body>
</html>
