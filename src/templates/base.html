<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbi - Interface d'Administration</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background-color: #121212;
            color: #f8f9fa;
        }
        
        .sidebar {
            height: 100vh;
            background-color: #1e1e1e;
            border-right: 1px solid #333;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            padding-top: 20px;
        }
        
        .main-content {
            margin-left: 250px; /* Offset for sidebar */
            padding: 20px;
        }

        .nav-link {
            color: #adb5bd;
            padding: 10px 20px;
            margin: 5px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: #fff;
            background-color: #0d6efd;
        }

        .nav-link i {
            margin-right: 10px;
        }

        .stat-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 2.5rem;
            opacity: 0.8;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s;
            }
            .sidebar.show {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
            }
        }
    </style>
    
    <!-- Scripts (Load early if needed by child blocks) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- Sidebar Navbar -->
    {% if admin %}
    <nav class="sidebar col-md-3 col-lg-2 d-md-block">
        <div class="position-sticky">
            <div class="text-center mb-4">
                <h3 class="text-primary fw-bold"><i class="bi bi-globe"></i> Orbi</h3>
                <span class="badge bg-secondary">Administration V4</span>
            </div>

            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link {% if active_tab == 'home' %}active{% endif %}" href="/admin/">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_tab == 'users' %}active{% endif %}" href="/admin/users">
                        <i class="bi bi-people"></i> Utilisateurs
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_tab == 'tickets' %}active{% endif %}" href="/admin/tickets">
                        <i class="bi bi-headset"></i> Support (Tickets)
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/dev/">
                        <i class="bi bi-robot"></i> Orbi Dev
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_tab == 'broadcasts' %}active{% endif %}" href="/admin/broadcasts">
                        <i class="bi bi-megaphone"></i> Broadcasts
                    </a>
                </li>
                <li class="nav-item mt-4">
                    <hr class="dropdown-divider border-secondary mx-3">
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning" href="/admin/config">
                        <i class="bi bi-gear"></i> Paramètres
                    </a>
                </li>
                <li class="nav-item">
                    <form method="post" action="/admin/logout" class="m-0"><button type="submit" class="nav-link text-danger btn btn-link text-start w-100">
                        <i class="bi bi-box-arrow-right"></i> Déconnexion
                    </button></form>
                </li>
            </ul>
        </div>
    </nav>
    {% endif %}

    <!-- Main Content Area -->
    <main class="main-content {% if not admin %}ms-0{% endif %}">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
