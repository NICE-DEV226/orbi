name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Le job « test » (3.12) garde son nom : c'est celui d'une éventuelle protection de branche.
    name: ${{ matrix.python == '3.12' && 'test' || format('test (py{0})', matrix.python) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = minimum supporté ; 3.14 = version de l'image Docker de production ; 3.13 = intermédiaire
        python: ["3.12", "3.13", "3.14"]
    services:
      mongodb:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: astral-sh/setup-uv@v7

      - name: Lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests (pytest)
        env:
          TELEGRAM_BOT_TOKEN: ci-test-token
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017
        run: pytest --cov=src --cov-report=term-missing

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependency vulnerability audit
        run: |
          pip install -e . pip-audit
          pip-audit --skip-editable

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t orbi:ci .

      - name: Compose file is valid
        env:
          TELEGRAM_BOT_TOKEN: ci
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
        run: docker compose config --quiet
