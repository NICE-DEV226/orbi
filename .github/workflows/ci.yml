name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Le job « test » (3.12) garde son nom : c'est celui d'une éventuelle protection de branche.
    name: ${{ matrix.python == '3.12' && 'test' || format('test (py{0})', matrix.python) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = minimum supporté ; 3.14 = version de l'image Docker de production ; 3.13 = intermédiaire
        python: ["3.12", "3.13", "3.14"]
    services:
      mongodb:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Lockfile is up to date
        run: uv lock --check

      # uv (et non pip) : le lockfile corrige la métadonnée de Beanie pour Python 3.14 (ADR-0006)
      # et garantit que la CI teste exactement les versions verrouillées.
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras --python ${{ matrix.python }}

      - name: Lint (ruff)
        run: uv run --frozen ruff check src tests

      - name: Tests (pytest)
        env:
          TELEGRAM_BOT_TOKEN: ci-test-token
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017
        run: uv run --frozen pytest --cov=src --cov-report=term-missing

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      # Audite les versions réellement verrouillées (celles de la production), pas ce que pip résoudrait aujourd'hui.
      - name: Dependency vulnerability audit
        run: |
          uv export --frozen --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt --no-deps --disable-pip

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t orbi:ci .

      - name: Compose file is valid
        env:
          TELEGRAM_BOT_TOKEN: ci
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
        run: docker compose config --quiet
