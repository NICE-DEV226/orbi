name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: astral-sh/setup-uv@v7

      - name: Lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests (pytest)
        env:
          TELEGRAM_BOT_TOKEN: ci-test-token
        run: pytest --cov=src --cov-report=term-missing

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependency vulnerability audit
        run: |
          pip install -e . pip-audit
          pip-audit --skip-editable

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t orbi:ci .

      - name: Compose file is valid
        env:
          TELEGRAM_BOT_TOKEN: ci
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
        run: docker compose config --quiet
