version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Beanie 2.x exige Python < 3.14 : ne pas proposer d'image 3.14 tant que Beanie ne la supporte pas.
      - dependency-name: python
        versions: [">=3.14"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
